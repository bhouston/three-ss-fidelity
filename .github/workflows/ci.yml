name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build unified website from committed results
        run: pnpm site:build
      - uses: actions/upload-artifact@v4
        with:
          name: unified-website
          path: site/
          if-no-files-found: error
      - run: pnpm tsc
      - run: pnpm lint
      - run: pnpm test --coverage
      - name: Install Chrome for unified browser contracts
        run: node submodules/fidelity-kit/scripts/install-test-browser.mjs
      - name: Check unified website and renderer contracts
        timeout-minutes: 10
        env:
          # Real pathtracer captures/benchmarks use small images; full-HD UI uses the GPU cube fixture.
          SMOKE_RENDERER: three-gpu-pathtracer
          SMOKE_LIVE_FIXTURE: cube
        run: xvfb-run --auto-servernum pnpm test:unified
      - name: Audit dependencies
        id: audit
        continue-on-error: true
        run: pnpm audit --audit-level=high
      - name: Flag audit findings
        if: steps.audit.outcome == 'failure'
        run: echo '::warning::Dependency audit found vulnerabilities or could not reach the registry. Review the audit step.'
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}-${{ github.job }}
          path: coverage/

  contribution:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate issue link
        run: node scripts/check-pr.mjs
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
      - name: Lint feature commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA"
