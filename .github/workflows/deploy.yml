name: Deploy three-fidelity to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy three-fidelity to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Initialize code submodules with shared caching
        run: |
          npm install --global git-dedup@3.0.2
          git-dedup submodule update --init submodules/three.js submodules/three-gpu-pathtracer submodules/fidelity-kit submodules/fidelity-kit-blender submodules/fidelity-kit-three-gpu-pathtracer
          git-dedup store add .
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build unified website
        env:
          RENDER_SERVER_URL: ${{ vars.RENDER_SERVER_URL }}
        run: pnpm site:build ${RENDER_SERVER_URL:+--root-url "$RENDER_SERVER_URL"}
      - name: Package browser render server
        run: node scripts/build-render-server.mjs --out site/render
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/
      - id: deployment
        uses: actions/deploy-pages@v4
